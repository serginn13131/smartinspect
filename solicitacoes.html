async function carregarSolicitacoes(){



const {data,error}=await banco

.from("usuarios")

.select("*")

.eq("status","pendente")

.order("id",{ascending:false});





const lista=document.getElementById("listaSolicitacoes");





if(error){


console.log(error);

lista.innerHTML="❌ Erro ao carregar solicitações";

return;


}





if(!data || data.length===0){


lista.innerHTML="✅ Nenhuma solicitação pendente";

return;


}







lista.innerHTML="";





data.forEach(usuario=>{



lista.innerHTML += `

</p>

</button>



</div>


`;



});



}









async function aceitarUsuario(id){



const cargo =

document.getElementById("cargo_"+id).value;





const {error}=await banco

.from("usuarios")

.update({

status:"ativo",

nivel_acesso:cargo

})

.eq("id",id);





if(error){


console.log(error);

alert("Erro ao aprovar usuário");

return;


}





alert("✅ Usuário aprovado!");

carregarSolicitacoes();


}










async function recusarUsuario(id){



const confirmar = confirm(

"Deseja recusar este cadastro?"

);



if(!confirmar){

return;

}





const {error}=await banco

.from("usuarios")

.update({

status:"recusado"

})

.eq("id",id);







if(error){


console.log(error);

alert("Erro ao recusar");

return;


}





alert("❌ Usuário recusado");


carregarSolicitacoes();


}







carregarSolicitacoes();
