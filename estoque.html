<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estoque - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<div class="menu-container"></div>

<main class="content">

    <header class="page-header">

        <div>

            <p class="eyebrow">
                CONTROLE DE MATERIAIS
            </p>

            <h1>
                📦 Estoque
            </h1>

            <p class="subtitle">
                Controle materiais, equipamentos,
                entradas e saídas da obra.
            </p>

        </div>


        <button
            class="primary-button"
            onclick="location.href='novo_estoque.html'">

            ➕ Novo Material

        </button>

    </header>


    <!-- ==========================================
         RESUMO
    =========================================== -->

    <section class="dashboard-grid">

        <div class="card">

            <p>
                Total de materiais
            </p>

            <h2 id="totalMateriais">
                0
            </h2>

        </div>


        <div class="card">

            <p>
                🟢 Estoque normal
            </p>

            <h2 id="materiaisDisponiveis">
                0
            </h2>

        </div>


        <div class="card">

            <p>
                🟠 Estoque baixo
            </p>

            <h2 id="materiaisBaixos">
                0
            </h2>

        </div>


        <div class="card">

            <p>
                🔴 Sem estoque
            </p>

            <h2 id="materiaisZerados">
                0
            </h2>

        </div>

    </section>


    <div id="mensagemEstoque"></div>


    <!-- ==========================================
         LISTA
    =========================================== -->

    <section>

        <div id="listaEstoque">

            <div class="card">

                <p>
                    🔄 Carregando estoque...
                </p>

            </div>

        </div>

    </section>

</main>


<!-- ==========================================
     SCRIPTS
=========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>


<script>

    // ==========================================
    // LOGIN
    // ==========================================

    verificarLogin();


    const $ = id =>
        document.getElementById(id);


    // ==========================================
    // ESCAPAR HTML
    // ==========================================

    function escaparHTML(valor) {

        return String(valor ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // CARREGAR ESTOQUE
    // ==========================================

    async function carregarEstoque() {

        $("listaEstoque").innerHTML = `

            <div class="card">

                <p>
                    🔄 Carregando estoque...
                </p>

            </div>

        `;


        const { data, error } = await banco

            .from("estoque")

            .select("*")

            .order("id", {
                ascending: false
            });


        if (error) {

            console.error(
                "Erro ao carregar estoque:",
                error
            );


            $("listaEstoque").innerHTML = `

                <div class="card">

                    <h2>
                        ❌ Erro ao carregar estoque
                    </h2>

                    <p>
                        ${escaparHTML(error.message)}
                    </p>

                </div>

            `;

            return;

        }


        const materiais =
            data || [];


        // ======================================
        // CONTADORES
        // ======================================

        let normais = 0;

        let baixos = 0;

        let zerados = 0;


        materiais.forEach(item => {

            const quantidade =
                Number(item.quantidade) || 0;


            if (quantidade <= 0) {

                zerados++;

            }
            else if (quantidade <= 5) {

                baixos++;

            }
            else {

                normais++;

            }

        });


        $("totalMateriais").textContent =
            materiais.length;

        $("materiaisDisponiveis").textContent =
            normais;

        $("materiaisBaixos").textContent =
            baixos;

        $("materiaisZerados").textContent =
            zerados;


        // ======================================
        // VAZIO
        // ======================================

        if (!materiais.length) {

            $("listaEstoque").innerHTML = `

                <div class="card">

                    <h2>
                        📦 Estoque vazio
                    </h2>

                    <p>
                        Nenhum material foi cadastrado ainda.
                    </p>

                    <br>

                    <button
                        class="primary-button"
                        onclick="location.href='novo_estoque.html'">

                        ➕ Cadastrar material

                    </button>

                </div>

            `;

            return;

        }


        // ======================================
        // CARDS
        // ======================================

        $("listaEstoque").innerHTML = materiais.map(item => {

            const quantidade =
                Number(item.quantidade) || 0;


            let statusClasse;

            let statusTexto;

            let statusIcone;


            if (quantidade <= 0) {

                statusClasse =
                    "estoque-critico";

                statusTexto =
                    "Sem estoque";

                statusIcone =
                    "🔴";

            }

            else if (quantidade <= 5) {

                statusClasse =
                    "estoque-atencao";

                statusTexto =
                    "Estoque baixo";

                statusIcone =
                    "🟠";

            }

            else {

                statusClasse =
                    "estoque-normal";

                statusTexto =
                    "Disponível";

                statusIcone =
                    "🟢";

            }


            return `

                <article
                    class="card estoque-card">


                    <!-- CABEÇALHO -->

                    <div
                        class="estoque-header">


                        <div>

                            <p class="eyebrow">

                                ${escaparHTML(
                                    item.categoria ||
                                    "MATERIAL"
                                )}

                            </p>


                            <h2>

                                📦
                                ${escaparHTML(
                                    item.nome ||
                                    "Material sem nome"
                                )}

                            </h2>

                        </div>


                        <span
                            class="estoque-status ${statusClasse}">

                            ${statusIcone}

                            ${statusTexto}

                        </span>


                    </div>


                    <hr>


                    <!-- INFORMAÇÕES -->

                    <div
                        class="estoque-info">


                        <div>

                            <span>
                                Quantidade
                            </span>

                            <strong>

                                ${quantidade}

                                ${escaparHTML(
                                    item.unidade ||
                                    "un"
                                )}

                            </strong>

                        </div>


                        <div>

                            <span>
                                Local
                            </span>

                            <strong>

                                ${escaparHTML(
                                    item.local ||
                                    "Não informado"
                                )}

                            </strong>

                        </div>


                        <div>

                            <span>
                                Status
                            </span>

                            <strong>

                                ${escaparHTML(
                                    item.status ||
                                    "Disponível"
                                )}

                            </strong>

                        </div>


                    </div>


                    <!-- ALERTA -->

                    ${
                        quantidade <= 5
                        ?

                        `

                        <div
                            class="estoque-alerta">

                            ${
                                quantidade <= 0

                                ?

                                "🚨 Este material está sem estoque."

                                :

                                "⚠️ Este material está com estoque baixo."

                            }

                            <br>

                            <small>
                                Verifique a necessidade
                                de reposição.
                            </small>

                        </div>

                        `

                        :

                        ""

                    }


                    <!-- AÇÕES -->

                    <div
                        class="estoque-actions">


                        <button
                            type="button"
                            onclick="movimentarMaterial(${item.id})">

                            📦 Movimentar

                        </button>


                        <button
                            type="button"
                            onclick="editarMaterial(${item.id})">

                            ✏️ Editar

                        </button>


                        <button
                            type="button"
                            onclick="excluirMaterial(${item.id})">

                            🗑 Excluir

                        </button>


                    </div>


                </article>

            `;

        }).join("");

    }


    // ==========================================
    // MOVIMENTAR
    // ==========================================

    function movimentarMaterial(id) {

        window.location.href =
            "movimentar_estoque.html?id=" + id;

    }


    // ==========================================
    // EDITAR
    // ==========================================

    function editarMaterial(id) {

        window.location.href =
            "novo_estoque.html?id=" + id;

    }


    // ==========================================
    // EXCLUIR
    // ==========================================

    async function excluirMaterial(id) {

        const confirmar =
            confirm(
                "Deseja realmente excluir este material?"
            );


        if (!confirmar) {

            return;

        }


        const { error } =
            await banco

                .from("estoque")

                .delete()

                .eq("id", id);


        if (error) {

            console.error(
                "Erro ao excluir material:",
                error
            );


            alert(
                "❌ Não foi possível excluir o material.\n\n" +
                error.message
            );

            return;

        }


        alert(
            "✅ Material excluído com sucesso!"
        );


        carregarEstoque();

    }


    // ==========================================
    // INICIAR
    // ==========================================

    carregarEstoque();

</script>
```

</body>

</html>
