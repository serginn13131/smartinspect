<script>


verificarLogin();






async function carregarEstoque(){



const {data,error}=await banco

.from("estoque")

.select(`

*,

obras(

nome

)

`)

.order("id",{ascending:false});





const lista=document.getElementById("listaEstoque");





if(error){

console.log(error);

lista.innerHTML="❌ Erro ao carregar estoque";

return;

}





if(!data || data.length===0){


lista.innerHTML="Nenhum material cadastrado";


return;


}







lista.innerHTML="";






data.forEach(item=>{






lista.innerHTML += `


<div class="card">





${item.foto ?

`

<img src="${item.foto}" 

style="width:180px;border-radius:10px;">

`

:

"📷 Sem foto"

}







<h2>

📦 ${item.material}

</h2>






<p>

🏢 Obra:

${item.obras ? item.obras.nome : "Sem obra"}

</p>







<p>

🔢 Quantidade:

${item.quantidade} ${item.unidade}

</p>







<p>

⚠️ Mínimo:

${item.estoque_minimo}

</p>








<p>

👤 Responsável:

${item.responsavel}

</p>







<p>

📌 Status:

${item.status}

</p>






<br>





<button onclick="excluirEstoque(${item.id})">

🗑 Excluir

</button>






</div>


`;






});







}









async function excluirEstoque(id){



let confirmar=confirm(

"Excluir este material?"

);



if(!confirmar)return;






const {error}=await banco

.from("estoque")

.delete()

.eq("id",id);






if(error){


alert("Erro ao excluir");


console.log(error);


return;


}



alert("Material excluído!");

carregarEstoque();



}







carregarEstoque();
