<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estoque - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="menu-container"></div>




<div class="content">


<h1>📦 Estoque</h1>

<p>
Controle de materiais e equipamentos
</p>




<button onclick="location.href='novo_estoque.html'">

➕ Novo Material

</button>





<div id="listaEstoque">


<p>
Carregando estoque...
</p>


</div>



</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>






<script>


verificarLogin();






async function carregarEstoque(){



const {data,error}=await banco

.from("estoque")

.select("*")

.order("id",{ascending:false});






const lista=document.getElementById("listaEstoque");





if(error){

console.log(error);

lista.innerHTML="❌ Erro ao carregar estoque";

return;

}





if(!data || data.length===0){


lista.innerHTML="Nenhum material cadastrado";


return;


}




lista.innerHTML="";





data.forEach(item=>{



lista.innerHTML += `



<div class="card">



<h2>

📦 ${item.nome}

</h2>





<p>

Categoria:

${item.categoria || "Não informado"}

</p>





<p>

Quantidade:

${item.quantidade || 0}

</p>





<p>

Unidade:

${item.unidade || "un"}

</p>





<p>

Local:

${item.local || "Não informado"}

</p>





<p>

Status:

${item.status || "Disponível"}

</p>





<button onclick="excluirMaterial(${item.id})">

🗑 Excluir

</button>





</div>



`;



});



}









async function excluirMaterial(id){


const confirmar = confirm(

"Deseja excluir este material?"

);



if(!confirmar)return;





const {error}=await banco

.from("estoque")

.delete()

.eq("id",id);





if(error){

alert("Erro ao excluir");

console.log(error);

return;

}



alert("Material removido");


carregarEstoque();



}







carregarEstoque();



</script>



</body>

</html>
