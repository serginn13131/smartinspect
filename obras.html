<h1>🏢 Obras Cadastradas</h1>

<p>Lista de obras registradas no sistema</p>



<div id="listaObras">

<p>Carregando obras...</p>

</div>



<br>


<button onclick="location.href='novaobra.html'">

➕ Nova Obra

</button>



</div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>





<script>



async function carregarObras(){



if(typeof banco === "undefined"){

document.getElementById("listaObras").innerHTML =
"❌ Banco não conectado";

return;

}





const {data, error} = await banco

.from("obras")

.select("*")

.order("id", {ascending:false});




let lista = document.getElementById("listaObras");




if(error){

lista.innerHTML =
"❌ Erro ao carregar obras";

console.log(error);

return;

}




if(data.length === 0){

lista.innerHTML =
"Nenhuma obra cadastrada";

return;

}





lista.innerHTML="";





data.forEach(obra => {



lista.innerHTML += `


<div class="card">


<h2>
🏢 ${obra.nome}
</h2>



<p>
📍 ${obra.endereco}
</p>



<p>
👷 Responsável: ${obra.responsavel}
</p>



<p>
📅 Início: ${obra.data_inicio}
</p>



<p>
📌 Status: ${obra.status}
</p>



<br>



<button onclick="deletarObra(${obra.id})">

🗑 Excluir Obra

</button>



</div>


`;



});



}







async function deletarObra(id){



let confirmar = confirm(
"⚠️ Tem certeza que deseja excluir esta obra?"
);




if(!confirmar){

return;

}




const {error} = await banco

.from("obras")

.delete()

.eq("id", id);





if(error){


alert("❌ Erro ao excluir obra");


console.log(error);


}

else{


alert("✅ Obra excluída com sucesso!");


carregarObras();


}



}






carregarObras();



</script>
