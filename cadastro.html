<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitar Acesso - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

body{

margin:0;

font-family:Arial, sans-serif;

}



.login-background{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(
rgba(0,0,0,0.65),
rgba(0,0,0,0.65)
),

url("imagens/logo.png");


background-size:cover;

background-position:center;

}




.login-card{

background:white;

width:420px;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 35px rgba(0,0,0,0.4);

}



.login-logo{

width:130px;

margin-bottom:15px;

}




.login-card h1{

color:#1f4e79;

}




.login-card label{

display:block;

text-align:left;

margin-top:15px;

font-weight:bold;

}



.login-card input,
.login-card select{


width:100%;

padding:12px;

margin-top:5px;

border-radius:8px;

border:1px solid #ccc;

box-sizing:border-box;

}



.login-card button{


width:100%;

padding:14px;

margin-top:20px;

border:none;

border-radius:10px;

background:#1f6feb;

color:white;

font-size:16px;

cursor:pointer;


}



.login-card button:hover{

background:#1555b0;

}



</style>


</head>


<body>



<div class="login-background">



<div class="login-card">



<img src="imagens/logo.png" class="login-logo">



<h1>

🏗 SmartInspect AI

</h1>



<p>

Solicitar acesso ao sistema

</p>





<label>

Nome completo

</label>


<input 

id="nome"

type="text"

placeholder="Digite seu nome">






<label>

Email

</label>


<input 

id="email"

type="email"

placeholder="Digite seu email">






<label>

Senha

</label>


<input 

id="senha"

type="password"

placeholder="Crie uma senha">





<label>

Função

</label>


<select id="nivel">


<option value="engenheiro">

🏗 Engenheiro / Arquiteto / Técnico

</option>


<option value="inspetor">

🔍 Inspetor

</option>


<option value="campo">

📷 Usuário de Campo

</option>


</select>







<button onclick="cadastrar()">

➕ Solicitar acesso

</button>






<p id="mensagem"></p>





<button onclick="location.href='login.html'">

⬅ Voltar para login

</button>





</div>


</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>





<script>


async function cadastrar(){



const nome =
document.getElementById("nome").value;


const email =
document.getElementById("email").value;


const senha =
document.getElementById("senha").value;


const nivel =
document.getElementById("nivel").value;






const {data,error}=await banco.auth.signUp({

email:email,

password:senha

});






if(error){


document.getElementById("mensagem").innerHTML=

"❌ Erro: "+error.message;


console.log(error);


return;


}







const {error:erroBanco}=await banco

.from("usuarios")

.insert([{


auth_id:data.user.id,

nome:nome,

email:email,

nivel_acesso:nivel,

status:"pendente"


}]);







if(erroBanco){


console.log(erroBanco);


document.getElementById("mensagem").innerHTML=

"❌ Erro ao salvar solicitação";


return;


}






document.getElementById("mensagem").innerHTML=

"✅ Solicitação enviada. Aguarde aprovação.";






}



</script>





</body>

</html>
