<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<div class="login-background">


<div class="login-card">


<img src="imagens/logo.png" class="login-logo">


<h1>
🏗 SmartInspect AI
</h1>


<h2>
Criar conta
</h2>


<p>
Solicite acesso ao sistema
</p>



<label>
Nome completo
</label>

<input 
id="nome"
type="text"
placeholder="Digite seu nome">





<label>
Email
</label>

<input 
id="email"
type="email"
placeholder="Digite seu email">





<label>
Senha
</label>

<input 
id="senha"
type="password"
placeholder="Crie uma senha">





<label>
Tipo de acesso
</label>


<select id="nivel">


<option value="campo">
📷 Usuário de Campo
</option>


<option value="inspetor">
🔍 Inspetor
</option>


<option value="engenheiro">
🏗 Engenheiro / Arquiteto / Técnico
</option>


</select>





<button onclick="cadastrar()">

➕ Criar conta

</button>





<button 
class="voltar"
onclick="location.href='login.html'">

⬅ Voltar

</button>



<p id="mensagem"></p>



</div>

</div>






<script src="js/supabase.js"></script>




<script>


async function cadastrar(){



const nome =
document.getElementById("nome").value.trim();


const email =
document.getElementById("email").value.trim();


const senha =
document.getElementById("senha").value;


const nivel =
document.getElementById("nivel").value;



const mensagem =
document.getElementById("mensagem");





if(!nome || !email || !senha){


mensagem.innerHTML =
"❌ Preencha todos os campos";


return;

}




mensagem.innerHTML =
"⏳ Criando usuário...";






// CRIA USUÁRIO NO SUPABASE AUTH


const {data,error} =

await banco.auth.signUp({

email:email,

password:senha

});





if(error){


mensagem.innerHTML =
"❌ "+error.message;


return;

}





// SALVA NA TABELA USUARIOS


const {error:erroBanco}=

await banco

.from("usuarios")

.insert([{


auth_id:data.user.id,


nome:nome,


email:email,


nivel_acesso:nivel,


status:"pendente",


data_criacao:new Date()


}]);






if(erroBanco){


console.log(erroBanco);


mensagem.innerHTML =

"❌ Erro ao salvar usuário: "+erroBanco.message;


return;


}






mensagem.innerHTML =

"✅ Cadastro enviado! Aguarde aprovação do administrador.";





document.getElementById("nome").value="";
document.getElementById("email").value="";
document.getElementById("senha").value="";



}




</script>



</body>

</html>
