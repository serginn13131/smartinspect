<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>


.perfil-box{

background:white;

padding:30px;

border-radius:15px;

max-width:500px;

box-shadow:0 3px 10px #0002;

}



.foto-perfil{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

border:4px solid #0066cc;

}



input{

width:100%;

padding:10px;

margin:8px 0;

border-radius:8px;

border:1px solid #ccc;

}



button{

background:#0066cc;

color:white;

border:none;

padding:10px 20px;

border-radius:10px;

cursor:pointer;

}



button:hover{

background:#0052a3;

}



.voltar{

background:#555;

margin-bottom:20px;

}



</style>


</head>


<body>



<div class="menu-container"></div>




<div class="content">



<button class="voltar" onclick="voltarPagina()">

⬅ Voltar

</button>




<h1>👤 Meu Perfil</h1>


<p>
Gerencie suas informações
</p>





<div class="perfil-box">





<img 
id="fotoPerfil"
class="foto-perfil"
src="imagens/avatar.png"
>




<br><br>



<input 
type="file"
id="novaFoto"
accept="image/*"
>




<h2 id="nomeUsuario">

Carregando...

</h2>




<p id="emailUsuario">

</p>



<p>

Cargo:

<strong id="cargoUsuario">

</strong>

</p>





<label>

Nome:

</label>


<input id="nome">






<button onclick="salvarPerfil()">

💾 Salvar alterações

</button>



<p id="mensagem"></p>



</div>






</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>







<script>



verificarLogin();




let usuarioAtual=null;







async function carregarPerfil(){



const {data,error}=await banco.auth.getUser();





if(error || !data.user){

return;

}






const {data:perfil}=await banco

.from("usuarios")

.select("*")

.eq("auth_id",data.user.id)

.single();






if(!perfil){

return;

}




usuarioAtual=perfil;





document.getElementById("nomeUsuario").innerHTML=

perfil.nome || "Usuário";





document.getElementById("emailUsuario").innerHTML=

perfil.email;





document.getElementById("cargoUsuario").innerHTML=

perfil.nivel_acesso || "Usuário";





document.getElementById("nome").value=

perfil.nome || "";






if(perfil.foto_url){

document.getElementById("fotoPerfil").src=

perfil.foto_url;

}



}









async function salvarPerfil(){



const nome=

document.getElementById("nome").value;





let foto_url = usuarioAtual.foto_url;





const arquivo=

document.getElementById("novaFoto").files[0];






if(arquivo){



const nomeArquivo=

`${usuarioAtual.id}-${Date.now()}`;



const {error}=await banco.storage

.from("fotos")

.upload(

nomeArquivo,

arquivo,

{

upsert:true

}

);





if(error){

console.log(error);

alert("Erro ao enviar foto");

return;

}





const url=

banco.storage

.from("fotos")

.getPublicUrl(nomeArquivo)

.data.publicUrl;




foto_url=url;



}








const {error}=await banco

.from("usuarios")

.update({

nome,

foto_url

})

.eq(

"id",

usuarioAtual.id

);







if(error){

console.log(error);

document.getElementById("mensagem").innerHTML=

"❌ Erro ao salvar";

return;

}





document.getElementById("mensagem").innerHTML=

"✅ Perfil atualizado";





carregarPerfil();



}








function voltarPagina(){


window.history.back();


}





carregarPerfil();



</script>



</body>

</html>
