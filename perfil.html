<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.perfil-container{

max-width:500px;

margin:auto;

}


.perfil-card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 5px 20px #0002;

text-align:center;

}



.foto-perfil{

width:150px;

height:150px;

border-radius:50%;

object-fit:cover;

border:4px solid #0066cc;

}



.cargo{

display:inline-block;

background:#0066cc;

color:white;

padding:8px 15px;

border-radius:20px;

margin:10px;

}



.info{

text-align:left;

margin-top:20px;

}



.info p{

padding:8px;

border-bottom:1px solid #ddd;

}



button{

padding:12px 20px;

border:none;

border-radius:10px;

background:#0066cc;

color:white;

cursor:pointer;

margin-top:10px;

}



button:hover{

background:#004c99;

}



.voltar{

background:#555;

}



</style>

</head>


<body>


<div class="menu-container"></div>



<div class="content">


<button class="voltar" onclick="history.back()">

⬅ Voltar

</button>



<h1>👤 Meu Perfil</h1>



<div class="perfil-container">


<div class="perfil-card">



<img 
id="fotoPerfil"
class="foto-perfil"
src="imagens/avatar.png"
>



<h2 id="nome">

Carregando...

</h2>



<span id="cargo" class="cargo">

</span>




<div class="info">


<p>

📧 Email:

<br>

<span id="email"></span>

</p>



<p>

🆔 ID:

<br>

<span id="idUsuario"></span>

</p>



<p>

🟢 Status:

<br>

<span id="status"></span>

</p>



</div>





<input

type="file"

id="foto"

accept="image/*"

>



<br>


<button onclick="salvarFoto()">

📷 Alterar foto

</button>



</div>


</div>



</div>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/auth.js"></script>



<script>


let usuarioAtual=null;





async function carregarPerfil(){



const usuarioLocal = 
JSON.parse(localStorage.getItem("usuario"));



if(!usuarioLocal){

window.location.href="login.html";

return;

}





const {data,error}=await banco

.from("usuarios")

.select("*")

.eq("id",usuarioLocal.id)

.single();





if(error){

console.log(error);

return;

}





usuarioAtual=data;



document.getElementById("nome").innerHTML =
data.nome;



document.getElementById("email").innerHTML =
data.email;



document.getElementById("cargo").innerHTML =
data.nivel_acesso;



document.getElementById("idUsuario").innerHTML =
data.id;



document.getElementById("status").innerHTML =
data.status;





if(data.foto_url){


document.getElementById("fotoPerfil").src =
data.foto_url;


}



}









async function salvarFoto(){



const arquivo =

document.getElementById("foto").files[0];





if(!arquivo){

alert("Selecione uma foto");

return;

}







const nomeArquivo =

`${usuarioAtual.id}/${Date.now()}-${arquivo.name}`;






const {error:uploadError}=await banco.storage

.from("fotos")

.upload(nomeArquivo,arquivo,{

upsert:true

});





if(uploadError){


console.log(uploadError);


alert("Erro ao enviar foto");


return;


}







const {data:urlData}=banco.storage

.from("fotos")

.getPublicUrl(nomeArquivo);







const fotoUrl=urlData.publicUrl;







const {error:updateError}=await banco

.from("usuarios")

.update({

foto_url:fotoUrl

})

.eq("id",usuarioAtual.id);






if(updateError){


console.log(updateError);


alert("Erro ao salvar foto");


return;


}







usuarioAtual.foto_url=fotoUrl;



localStorage.setItem(

"usuario",

JSON.stringify(usuarioAtual)

);





alert("✅ Foto atualizada com sucesso!");



location.reload();



}







carregarPerfil();



</script>


</body>

</html>
