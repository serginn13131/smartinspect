<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

.perfil-box{

background:white;
padding:25px;
border-radius:15px;
max-width:500px;
box-shadow:0 3px 10px #0002;

}


.foto-perfil{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #0066cc;

}


button{

background:#0066cc;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;

}


input{

width:100%;
padding:10px;
margin:8px 0;

}


.voltar{

background:#555;

}


</style>

</head>


<body>


<div class="menu-container"></div>



<div class="content">



<button class="voltar" onclick="history.back()">

⬅ Voltar

</button>



<h1>👤 Meu Perfil</h1>


<p>
Informações da conta
</p>




<div class="perfil-box">



<img 
id="fotoPerfil"
class="foto-perfil"
src="imagens/avatar.png"
>




<br><br>


<input 
type="file"
id="fotoInput"
accept="image/*"
>



<h2 id="nomeUsuario">

Carregando...

</h2>



<p>

📧 <span id="emailUsuario"></span>

</p>



<p>

Cargo:

<strong id="cargoUsuario"></strong>

</p>



<p>

Status:

<strong id="statusUsuario"></strong>

</p>



<hr>




<label>

Nome

</label>


<input 
id="nome"
>




<button onclick="salvarPerfil()">

💾 Salvar

</button>



<p id="mensagem"></p>




</div>





</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>






<script>


let usuarioAtual=null;






async function carregarPerfil(){



const {data:{user},error}=await banco.auth.getUser();




if(error || !user){

window.location.href="login.html";

return;

}






const {data:perfil,error:erroPerfil}=await banco

.from("usuarios")

.select("*")

.eq("auth_id",user.id)

.single();





if(erroPerfil || !perfil){


console.log(erroPerfil);


alert("Usuário não encontrado");


return;


}






usuarioAtual=perfil;






document.getElementById("nomeUsuario").innerHTML=

perfil.nome || "Sem nome";





document.getElementById("emailUsuario").innerHTML=

perfil.email;




document.getElementById("cargoUsuario").innerHTML=

perfil.nivel_acesso || "usuario";





document.getElementById("statusUsuario").innerHTML=

perfil.status || "pendente";





document.getElementById("nome").value=

perfil.nome || "";






if(perfil.foto_url){


document.getElementById("fotoPerfil").src=

perfil.foto_url;


}




}









async function salvarPerfil(){



if(!usuarioAtual)return;




let foto_url=usuarioAtual.foto_url;




const arquivo=

document.getElementById("fotoInput").files[0];







// envia foto

if(arquivo){



const nomeArquivo=

`${usuarioAtual.id}/${Date.now()}-${arquivo.name}`;





const {error}=await banco.storage

.from("fotos")

.upload(

nomeArquivo,

arquivo,

{

upsert:true

}

);






if(error){

console.log(error);

alert("Erro ao enviar foto");

return;

}






const {data:urlData}=banco.storage

.from("fotos")

.getPublicUrl(nomeArquivo);





foto_url=urlData.publicUrl;



}







const {error}=await banco

.from("usuarios")

.update({

nome:

document.getElementById("nome").value,

foto_url

})

.eq(

"id",

usuarioAtual.id

);







if(error){


console.log(error);


document.getElementById("mensagem").innerHTML=

"❌ Erro ao atualizar";


return;


}






document.getElementById("mensagem").innerHTML=

"✅ Perfil atualizado";




carregarPerfil();



}






carregarPerfil();



</script>


</body>

</html>
