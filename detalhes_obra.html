<script>




const parametros =
new URLSearchParams(window.location.search);



const obraId =
parametros.get("id");









async function carregarObra(){



if(!obraId){


document.getElementById("dadosObra").innerHTML =

"❌ Obra não encontrada";


return;


}







const {data,error}=await banco

.from("obras")

.select("*")

.eq("id",obraId)

.single();






if(error){


console.log(error);


document.getElementById("dadosObra").innerHTML =

"❌ Erro ao carregar obra";


return;


}







document.getElementById("dadosObra").innerHTML = `


<h2>

🏢 ${data.nome}

</h2>



<p>

📍 Endereço:
${data.endereco}

</p>



<p>

👷 Responsável:
${data.responsavel}

</p>



<p>

📅 Data de início:
${data.data_inicio}

</p>



<p>

📌 Status:
${data.status}

</p>


`;



}









async function carregarInspecoes(){



const {data,error}=await banco

.from("inspecoes")

.select("*")

.eq("obra_id",obraId)

.order("id",{ascending:false});





let lista =
document.getElementById("listaInspecoes");





if(error){


console.log(error);


lista.innerHTML =
"❌ Erro ao carregar inspeções";


return;


}







document.getElementById("totalInspecoes").innerHTML =
data.length;








if(data.length === 0){


lista.innerHTML =

"<p>Nenhuma inspeção realizada.</p>";


return;


}







lista.innerHTML="";







data.forEach(inspecao=>{


lista.innerHTML += `


<div class="card">


<h3>

📋 ${inspecao.tipo}

</h3>



<p>

📅 Data:
${inspecao.data_inspecao}

</p>



<p>

👷 Responsável:
${inspecao.responsavel}

</p>



<p>

📌 Status:
${inspecao.status}

</p>



<p>

📝 ${inspecao.observacao || "Sem observação"}

</p>


</div>


`;



});





}









function novaInspecao(){


window.location.href =

"nova_inspecao.html?obra=" + obraId;


}







carregarObra();

carregarInspecoes();


const obraId =
parametros.get("id");

console.log("ID RECEBIDO:", obraId);


</script>
