<div class="content">


<h1>👥 Controle de Usuários</h1>

<p>Aprovação e gerenciamento de acessos</p>


<div id="listaUsuarios">

Carregando usuários...

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>



<script>


let usuarios = [];



// CARREGAR USUÁRIOS

async function carregarUsuarios(){


const {data,error}=await banco

.from("usuarios")

.select("*")

.order("id",{ascending:false});



if(error){

console.log(error);

document.getElementById("listaUsuarios").innerHTML =
"Erro ao carregar usuários";

return;

}



usuarios=data || [];

renderizarUsuarios();


}





// MOSTRAR USUÁRIOS


function renderizarUsuarios(){


const lista=document.getElementById("listaUsuarios");


if(usuarios.length === 0){

lista.innerHTML=
`
<div class="card">

<h3>Nenhum usuário cadastrado</h3>

</div>
`;

return;

}




lista.innerHTML="";



usuarios.forEach(usuario=>{


lista.innerHTML +=


`

<div class="card">


<h2>
👤 ${usuario.nome || "Sem nome"}
</h2>



<p>
📧 ${usuario.email}
</p>



<p>
🛡 Cargo:
<strong>
${usuario.nivel_acesso || "usuario"}
</strong>
</p>



<p>
Status:
<strong>
${usuario.status}
</strong>
</p>



${usuario.status === "pendente" ?


`

<button onclick="aprovar(${usuario.id})">

✅ Aprovar

</button>



<button onclick="recusar(${usuario.id})">

❌ Recusar

</button>

`

:

usuario.status === "ativo"


?

`

<button onclick="bloquear(${usuario.id})">

🚫 Bloquear

</button>

`

:

""



}



</div>


`;



});



}






// APROVAR USUÁRIO


async function aprovar(id){


const {error}=await banco

.from("usuarios")

.update({

status:"ativo"

})

.eq("id",id);



if(error){

console.log(error);

alert("Erro ao aprovar usuário");

return;

}



alert("Usuário aprovado!");

carregarUsuarios();



}







// RECUSAR USUÁRIO


async function recusar(id){


const {error}=await banco

.from("usuarios")

.update({

status:"recusado"

})

.eq("id",id);



if(error){

console.log(error);

alert("Erro ao recusar usuário");

return;

}



alert("Usuário recusado!");

carregarUsuarios();



}







// BLOQUEAR USUÁRIO ATIVO


async function bloquear(id){


const {error}=await banco

.from("usuarios")

.update({

status:"bloqueado"

})

.eq("id",id);



if(error){

console.log(error);

alert("Erro ao bloquear");

return;

}



alert("Usuário bloqueado!");

carregarUsuarios();



}







carregarUsuarios();



</script>


</body>
