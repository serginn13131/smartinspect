<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuários - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.usuarios-grid{

display:grid;

gap:15px;

}


.usuario-card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #0002;

display:flex;

align-items:center;

gap:15px;

}



.avatar{

width:55px;

height:55px;

border-radius:50%;

background:#0066cc;

color:white;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

}



.info{

flex:1;

display:flex;

flex-direction:column;

}



.status{

padding:6px 12px;

border-radius:20px;

font-size:13px;

}



.online{

background:#d1fae5;

color:green;

}



.offline{

background:#eee;

color:#666;

}



select{

padding:8px;

border-radius:8px;

}


.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:15px;

margin-bottom:20px;

}


.card-info{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #0002;

}


</style>


</head>


<body>


<div class="menu-container"></div>




<div class="content">


<h1>👥 Controle de Usuários</h1>


<p>

Gerenciamento de cargos e acessos

</p>




<div class="cards">


<div class="card-info">

<h2 id="totalUsuarios">
0
</h2>

<p>
Usuários
</p>

</div>



<div class="card-info">

<h2 id="usuariosOnline">
0
</h2>

<p>
Online
</p>

</div>



<div class="card-info">

<h2 id="usuariosPendentes">
0
</h2>

<p>
Pendentes
</p>

</div>



</div>





<div class="card">


<input

id="buscaEquipe"

placeholder="🔎 Buscar usuário..."

>



<br><br>



<button onclick="filtrar('todos')">

Todos

</button>


<button onclick="filtrar('online')">

Online

</button>


<button onclick="filtrar('offline')">

Offline

</button>



<p id="statusPresenca">

Conectando...

</p>


</div>







<div id="listaUsuarios" class="usuarios-grid">

Carregando usuários...

</div>



<p id="mensagemEquipe"></p>




</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>



<script>


verificarLogin();



let usuarios=[];

let filtro="todos";

let usuarioAtual =
JSON.parse(localStorage.getItem("usuario"));



const admin =
usuarioAtual?.nivel_acesso==="adm";



const niveis=[

"adm",

"engenheiro",

"inspetor",

"tecnico",

"usuario"

];





async function carregarUsuarios(){


const {data,error}=await banco

.from("usuarios")

.select("*")

.order("id",{ascending:false});



if(error){

console.log(error);

return;

}



usuarios=data || [];

renderizar();

}





function renderizar(){



const lista =
document.getElementById("listaUsuarios");



document.getElementById("totalUsuarios").innerHTML =
usuarios.length;



document.getElementById("usuariosPendentes").innerHTML =
usuarios.filter(
u=>u.status==="pendente"
).length;



let online =
usuarios.filter(
u=>u.online
).length;



document.getElementById("usuariosOnline").innerHTML =
online;



let busca =
document.getElementById("buscaEquipe").value.toLowerCase();



let listaFiltrada =
usuarios.filter(u=>{


let nome =
(u.nome+" "+u.email).toLowerCase();



if(!nome.includes(busca))
return false;



if(filtro==="online")
return u.online;



if(filtro==="offline")
return !u.online;



return true;


});






lista.innerHTML="";



listaFiltrada.forEach(u=>{


lista.innerHTML += `


<div class="usuario-card">


<div class="avatar">

${u.nome?.charAt(0) || "?"}

</div>



<div class="info">

<strong>

${u.nome || "Sem nome"}

</strong>


<span>

${u.email}

</span>



<span class="status ${u.online?'online':'offline'}">

${u.online?'🟢 Online':'⚪ Offline'}

</span>


</div>





<select

onchange="alterarCargo(${u.id},this.value)"

${admin?"":"disabled"}

>


${niveis.map(n=>`

<option ${n===u.nivel_acesso?'selected':''}>

${n}

</option>

`).join("")}


</select>



</div>



`;



});



}





async function alterarCargo(id,cargo){



if(!admin)return;



const {error}=await banco

.from("usuarios")

.update({

nivel_acesso:cargo

})

.eq("id",id);



if(error){

mensagemEquipe.innerHTML=
"❌ Erro ao alterar cargo";

return;

}



mensagemEquipe.innerHTML=
"✅ Cargo alterado com sucesso";



carregarUsuarios();


}





function filtrar(tipo){

filtro=tipo;

renderizar();

}





document

.getElementById("buscaEquipe")

.addEventListener(

"input",

renderizar

);






carregarUsuarios();



</script>



</body>

</html>
