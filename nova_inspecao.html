<h1>📋 Nova Inspeção</h1>

<p>Registre uma nova inspeção da obra</p>



<div class="card">


<label>Obra</label>

<select id="obra">

<option>
Carregando obras...
</option>

</select>




<label>Tipo de Inspeção</label>

<select id="tipo">

<option>Estrutura</option>

<option>Alvenaria</option>

<option>Revestimento</option>

<option>Instalações</option>

<option>Acabamento</option>

</select>




<label>Data da Inspeção</label>

<input type="date" id="data">





<label>Responsável</label>

<input 
id="responsavel"
type="text"
placeholder="Nome do inspetor">





<label>Observações</label>

<textarea 
id="observacao"
placeholder="Descreva a inspeção">
</textarea>




<label>Status</label>

<select id="status">

<option>Aprovado</option>

<option>Pendente</option>

<option>Reprovado</option>

</select>




<br><br>


<button onclick="salvarInspecao()">

💾 Salvar Inspeção

</button>


</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>



<script>


// carregar obras no select

async function carregarObras(){


const {data,error}=await banco

.from("obras")

.select("*");



const select=document.getElementById("obra");


select.innerHTML="";



if(data){


data.forEach(obra=>{


select.innerHTML += `

<option value="${obra.id}">

${obra.nome}

</option>

`;


});


}



}



carregarObras();





// salvar inspeção


async function salvarInspecao(){



const obra_id =
document.getElementById("obra").value;



const tipo =
document.getElementById("tipo").value;



const data_inspecao =
document.getElementById("data").value;



const responsavel =
document.getElementById("responsavel").value;



const observacao =
document.getElementById("observacao").value;



const status =
document.getElementById("status").value;





const {data,error}=await banco

.from("inspecoes")

.insert([{


obra_id:obra_id,

tipo:tipo,

data_inspecao:data_inspecao,

responsavel:responsavel,

observacao:observacao,

status:status


}]);





if(error){


console.log(error);


alert("❌ Erro ao salvar inspeção");


}

else{


alert("✅ Inspeção cadastrada com sucesso!");


window.location.href="inspecoes.html";


}



}



</script>
