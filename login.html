<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{

margin:0;

font-family:Arial, sans-serif;

}



.login-background{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(
rgba(0,0,0,0.65),
rgba(0,0,0,0.65)
),

url("imagens/logo.png");


background-size:cover;

background-position:center;

}





.login-card{

background:white;

width:380px;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 35px rgba(0,0,0,0.4);

}



.login-logo{

width:130px;

height:auto;

margin-bottom:15px;

}



.login-card h1{

color:#1f4e79;

margin-bottom:10px;

}



.login-card p{

color:#555;

}



.login-card label{

display:block;

text-align:left;

margin-top:15px;

font-weight:bold;

}



.login-card input{


width:100%;

padding:12px;

margin-top:5px;

border-radius:8px;

border:1px solid #ccc;

box-sizing:border-box;

font-size:15px;

}





.login-card button{


width:100%;

padding:14px;

margin-top:20px;

border:none;

border-radius:10px;

background:#1f6feb;

color:white;

font-size:16px;

cursor:pointer;


}



.login-card button:hover{

background:#1555b0;

}



#mensagem{

margin-top:15px;

font-weight:bold;

}



</style>


</head>


<body>


<div class="login-background">



<div class="login-card">



<img src="imagens/logo.png" class="login-logo">



<h1>

🏗 SmartInspect AI

</h1>



<p>

Acesso ao sistema inteligente de inspeção de obras

</p>





<label>

Email

</label>


<input 

id="email"

type="email"

placeholder="Digite seu email">





<label>

Senha

</label>


<input 

id="senha"

type="password"

placeholder="Digite sua senha">





<button onclick="entrar()">

🔐 Entrar

</button>




<button onclick="location.href='cadastro.html'">

➕ Solicitar acesso

</button>





<p id="mensagem"></p>




</div>



</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>





<script>



async function entrar(){



const email =

document.getElementById("email").value;



const senha =

document.getElementById("senha").value;







const {data,error}=await banco.auth.signInWithPassword({

email:email,

password:senha

});






if(error){


document.getElementById("mensagem").innerHTML=

"❌ Email ou senha inválidos";


console.log(error);


return;


}








const {data:usuario,error:erroUsuario}=await banco

.from("usuarios")

.select("*")

.eq("auth_id",data.user.id)

.maybeSingle();






if(erroUsuario || !usuario){


alert("Usuário não encontrado");


return;


}







if(usuario.status !== "ativo"){


alert("⏳ Seu acesso ainda não foi aprovado");


await banco.auth.signOut();


return;


}







localStorage.setItem(

"usuario",

JSON.stringify(usuario)

);






window.location.href="index.html";





}





</script>



</body>

</html>
