<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipe - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.equipe-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;

}



.membro{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #0002;

display:flex;

align-items:center;

gap:15px;

}



.avatar-box{

position:relative;

}



.foto-perfil{

width:80px;

height:80px;

border-radius:50%;

object-fit:cover;

border:3px solid #0066cc;

background:#eee;

}



.ponto-online{

position:absolute;

right:5px;

bottom:5px;

width:16px;

height:16px;

border-radius:50%;

background:#999;

border:2px solid white;

}



.ponto-online.ativo{

background:green;

}



.status{

font-size:14px;

}



.online{

color:green;

}



.offline{

color:gray;

}



.cargo{

background:#0066cc;

color:white;

padding:5px 10px;

border-radius:10px;

font-size:13px;

}



.permissoes{

margin-top:10px;

font-size:13px;

}



</style>


</head>



<body>


<!-- SIDEBAR PADRÃO -->

<div class="menu-container"></div>



<div class="content">


<h1>👥 Equipe</h1>

<p>
Usuários cadastrados e níveis de acesso
</p>



<div id="listaEquipe" class="equipe-grid">

Carregando equipe...

</div>



</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/auth.js"></script>



<script>


let equipe=[];



async function carregarEquipe(){



const {data,error}=await banco

.from("usuarios")

.select("*")

.order("id",{ascending:false});





if(error){


console.log(error);


document.getElementById("listaEquipe").innerHTML=

"❌ Erro ao carregar equipe";


return;


}





equipe=data || [];


mostrarEquipe();


}








function mostrarEquipe(){



const lista=document.getElementById("listaEquipe");


lista.innerHTML="";





if(equipe.length===0){


lista.innerHTML=

"Nenhum usuário encontrado.";


return;


}







equipe.forEach(usuario=>{



let permissoes="";





if(usuario.nivel_acesso==="adm"){


permissoes=

"✅ Controle total do sistema";


}




if(usuario.nivel_acesso==="engenheiro"){


permissoes=

"✅ Obras<br>✅ Inspeções<br>✅ Relatórios<br>✅ IA";


}




if(usuario.nivel_acesso==="inspetor"){


permissoes=

"✅ Inspeções<br>✅ Fotos<br>✅ Relatórios";


}




if(usuario.nivel_acesso==="tecnico"){


permissoes=

"✅ Obras<br>✅ Inspeções";


}




if(usuario.nivel_acesso==="usuario"){


permissoes=

"👁 Visualização";


}








lista.innerHTML += `


<div class="membro">



<div class="avatar-box">


<img

class="foto-perfil"

src="${usuario.foto_url || 'imagens/avatar.png'}"

onerror="this.src='imagens/avatar.png'"

>


<span class="ponto-online ${usuario.online ? 'ativo':''}"></span>


</div>





<div>


<h3>

${usuario.nome || "Sem nome"}

</h3>



<p>

📧 ${usuario.email || ""}

</p>



<span class="cargo">

${usuario.nivel_acesso || "usuario"}

</span>





<p class="status ${usuario.online ? 'online':'offline'}">

● ${usuario.online ? "Online":"Offline"}

</p>





<p>

Último acesso:

<br>

${usuario.ultimo_acesso

?

new Date(usuario.ultimo_acesso).toLocaleString()

:

"Nunca"

}

</p>




<div class="permissoes">

${permissoes}

</div>



</div>


</div>


`;



});



}









// REALTIME


function ouvirOnline(){



banco

.channel("equipe-tempo-real")

.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"usuarios"

},

()=>{


carregarEquipe();


}

)

.subscribe();



}







carregarEquipe();

ouvirOnline();



</script>



</body>

</html>
