<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipe - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.equipe-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;

}


.membro{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #0002;

display:flex;
align-items:center;
gap:15px;

}


.foto-perfil{

width:70px;
height:70px;
border-radius:50%;
object-fit:cover;

}


.status{

font-size:14px;

}


.online{

color:green;

}


.offline{

color:gray;

}


.cargo{

background:#0066cc;
color:white;

padding:5px 10px;

border-radius:10px;

font-size:13px;

}


.permissoes{

margin-top:10px;
font-size:13px;

}


</style>

</head>



<body>


<!-- SIDEBAR PADRÃO -->

<div class="menu-container"></div>



<div class="content">


<h1>👥 Equipe</h1>

<p>
Usuários cadastrados e níveis de acesso
</p>



<div id="listaEquipe" class="equipe-grid">

Carregando equipe...

</div>



</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/sidebar.js"></script>



<script>


let equipe=[];



async function carregarEquipe(){


const {data,error}=await banco

.from("usuarios")

.select("*")

.order("id",{ascending:false});



if(error){

console.log(error);


document.getElementById("listaEquipe").innerHTML =
"Erro ao carregar equipe";


return;

}



equipe=data || [];


mostrarEquipe();



}





function mostrarEquipe(){


const lista=document.getElementById("listaEquipe");


lista.innerHTML="";



if(equipe.length===0){

lista.innerHTML="Nenhum usuário encontrado.";

return;

}




equipe.forEach(usuario=>{



lista.innerHTML += `


<div class="membro">


<img 
class="foto-perfil"
src="${usuario.foto_url || 'imagens/avatar.png'}"
>



<div>


<h3>

${usuario.nome || "Sem nome"}

</h3>



<p>

📧 ${usuario.email || ""}

</p>



<span class="cargo">

${usuario.nivel_acesso || "usuario"}

</span>




<p class="status ${usuario.online ? 'online':'offline'}">


● 

${usuario.online ? "Online":"Offline"}


</p>



<p>

Último acesso:

<br>

${usuario.ultimo_acesso 

? new Date(usuario.ultimo_acesso).toLocaleString()

: "Nunca"}

</p>




<div class="permissoes">


${usuario.nivel_acesso==="adm"

? "✅ Controle total"

:""
}



${usuario.nivel_acesso==="engenheiro"

? "✅ Obras<br>✅ Inspeções<br>✅ Relatórios"

:""
}



${usuario.nivel_acesso==="inspetor"

? "✅ Criar inspeções<br>✅ Enviar fotos"

:""
}



${usuario.nivel_acesso==="usuario"

? "👁 Visualização"

:""
}



</div>



</div>



</div>


`;



});


}





// Atualiza quando alguém muda no banco

function ouvirOnline(){


banco

.channel("usuarios-online")

.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"usuarios"

},

()=>{

carregarEquipe();

}

)

.subscribe();



}




carregarEquipe();

ouvirOnline();



</script>


</body>

</html>
