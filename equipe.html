<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Equipe - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.equipe-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));

gap:20px;

}


.membro{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #0002;

display:flex;

align-items:center;

gap:15px;

}


.avatar-box{

position:relative;

}


.foto-perfil{

width:80px;

height:80px;

border-radius:50%;

object-fit:cover;

border:3px solid #0066cc;

background:#eee;

}


.ponto-online{

position:absolute;

right:5px;

bottom:5px;

width:16px;

height:16px;

border-radius:50%;

background:#999;

border:2px solid white;

}


.ponto-online.ativo{

background:#16a34a;

box-shadow:0 0 8px #16a34a;

}


.status{

font-size:14px;

font-weight:600;

}


.online{

color:#16a34a;

}


.offline{

color:#777;

}


.cargo{

background:#0066cc;

color:white;

padding:5px 10px;

border-radius:10px;

font-size:13px;

}


.permissoes{

margin-top:10px;

font-size:13px;

line-height:1.6;

}


.ultimo-acesso{

font-size:13px;

color:#666;

margin-top:8px;

}


</style>

</head>


<body>


<!-- SIDEBAR PADRÃO -->

<div class="menu-container"></div>


<div class="content">


<h1>👥 Equipe</h1>

<p>
Usuários da sua empresa
</p>


<div id="listaEquipe" class="equipe-grid">

Carregando equipe...

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/auth.js"></script>



<script>

let equipe = [];

let empresaAtual = null;

let canalEquipe = null;


/*
====================================================
PEGAR USUÁRIO LOGADO
====================================================
*/

async function obterUsuarioAtual(){

    const {
        data: { user },
        error
    } = await banco.auth.getUser();


    if(error){

        console.error(
            "Erro ao verificar usuário:",
            error
        );

        return null;

    }


    if(!user){

        console.warn(
            "Nenhum usuário autenticado."
        );

        return null;

    }


    return user;

}


/*
====================================================
DESCOBRIR EMPRESA DO USUÁRIO
====================================================
*/

async function descobrirEmpresa(){

    const usuarioAuth =
        await obterUsuarioAtual();


    if(!usuarioAuth){

        return null;

    }


    const {
        data,
        error
    } = await banco

        .from("usuarios")

        .select("id, empresa_id, nome, email")

        .eq(
            "auth_id",
            usuarioAuth.id
        )

        .maybeSingle();


    if(error){

        console.error(
            "Erro ao descobrir empresa:",
            error
        );

        return null;

    }


    if(!data){

        console.warn(
            "Perfil do usuário não encontrado."
        );

        return null;

    }


    if(!data.empresa_id){

        console.warn(
            "Este usuário não possui empresa_id."
        );

        return null;

    }


    empresaAtual = data.empresa_id;


    return empresaAtual;

}


/*
====================================================
VERIFICAR SE ESTÁ ONLINE
====================================================
*/

function estaOnline(usuario){

    if(!usuario.ultimo_heartbeat){

        return false;

    }


    const ultimoHeartbeat =
        new Date(
            usuario.ultimo_heartbeat
        ).getTime();


    const agora =
        Date.now();


    const diferenca =
        agora - ultimoHeartbeat;


    /*
    60 segundos

    Se o heartbeat aconteceu
    nos últimos 60 segundos,
    consideramos online.
    */

    return diferenca <= 60000;

}


/*
====================================================
CARREGAR EQUIPE
====================================================
*/

async function carregarEquipe(){

    if(!empresaAtual){

        const empresa =
            await descobrirEmpresa();


        if(!empresa){

            document.getElementById(
                "listaEquipe"
            ).innerHTML =

            `
            ❌ Não foi possível identificar
            a empresa deste usuário.
            `;

            return;

        }

    }


    const {
        data,
        error
    } = await banco

        .from("usuarios")

        .select("*")

        .eq(
            "empresa_id",
            empresaAtual
        )

        .order(
            "id",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Erro ao carregar equipe:",
            error
        );


        document.getElementById(
            "listaEquipe"
        ).innerHTML =

        `
        ❌ Erro ao carregar equipe.
        `;

        return;

    }


    equipe = data || [];


    mostrarEquipe();

}


/*
====================================================
PERMISSÕES
====================================================
*/

function obterPermissoes(
    nivel
){

    switch(nivel){

        case "adm":

            return `
            ✅ Controle total do sistema
            `;


        case "engenheiro":

            return `
            ✅ Obras<br>
            ✅ Inspeções<br>
            ✅ Relatórios<br>
            ✅ IA
            `;


        case "inspetor":

            return `
            ✅ Inspeções<br>
            ✅ Fotos<br>
            ✅ Relatórios
            `;


        case "tecnico":

            return `
            ✅ Obras<br>
            ✅ Inspeções
            `;


        case "usuario":

            return `
            👁 Visualização
            `;


        default:

            return `
            👁 Acesso básico
            `;

    }

}


/*
====================================================
 FORMATAR DATA
====================================================
*/

function formatarData(
    data
){

    if(!data){

        return "Nunca";

    }


    return new Date(
        data
    ).toLocaleString(
        "pt-BR"
    );

}


/*
====================================================
 MOSTRAR EQUIPE
====================================================
*/

function mostrarEquipe(){

    const lista =
        document.getElementById(
            "listaEquipe"
        );


    lista.innerHTML = "";


    if(equipe.length === 0){

        lista.innerHTML =
        "Nenhum usuário encontrado.";

        return;

    }


    equipe.forEach(
        usuario => {


        const online =
            estaOnline(
                usuario
            );


        const permissoes =
            obterPermissoes(
                usuario.nivel_acesso
            );


        lista.innerHTML += `

        <div class="membro">


            <div class="avatar-box">


                <img

                    class="foto-perfil"

                    src="${
                        usuario.foto_url ||
                        "imagens/avatar.png"
                    }"

                    onerror="
                        this.src='imagens/avatar.png'
                    "

                >


                <span

                    class="
                        ponto-online
                        ${online ? "ativo" : ""}
                    "

                ></span>


            </div>


            <div>


                <h3>

                    ${
                        usuario.nome ||
                        "Sem nome"
                    }

                </h3>


                <p>

                    📧 ${
                        usuario.email ||
                        ""
                    }

                </p>


                <span class="cargo">

                    ${
                        usuario.nivel_acesso ||
                        "usuario"
                    }

                </span>


                <p

                    class="
                        status
                        ${online ? "online" : "offline"}
                    "

                >

                    ●

                    ${
                        online
                        ? " Online agora"
                        : " Offline"
                    }

                </p>


                <p class="ultimo-acesso">

                    🕐 Último acesso:<br>

                    ${
                        formatarData(
                            usuario.ultimo_acesso
                        )
                    }

                </p>


                <div class="permissoes">

                    ${permissoes}

                </div>


            </div>


        </div>

        `;

    });

}


/*
====================================================
 ATUALIZAR O HEARTBEAT DO USUÁRIO LOGADO
====================================================
*/

async function atualizarHeartbeat(){

    const usuarioAuth =
        await obterUsuarioAtual();


    if(!usuarioAuth){

        return;

    }


    const agora =
        new Date().toISOString();


    const {
        error
    } = await banco

        .from("usuarios")

        .update({

            ultimo_heartbeat:
                agora

        })

        .eq(
            "auth_id",
            usuarioAuth.id
        );


    if(error){

        console.error(
            "Erro ao atualizar heartbeat:",
            error
        );

        return;

    }


}


/*
====================================================
 REGISTRAR ACESSO
====================================================
*/

async function registrarAcesso(){

    const usuarioAuth =
        await obterUsuarioAtual();


    if(!usuarioAuth){

        return;

    }


    const agora =
        new Date().toISOString();


    const {
        error
    } = await banco

        .from("usuarios")

        .update({

            ultimo_acesso:
                agora,

            ultimo_heartbeat:
                agora

        })

        .eq(
            "auth_id",
            usuarioAuth.id
        );


    if(error){

        console.error(
            "Erro ao registrar acesso:",
            error
        );

    }

}


/*
====================================================
 INICIAR PRESENÇA
====================================================
*/

async function iniciarPresenca(){

    await registrarAcesso();


    /*
    Atualiza heartbeat
    a cada 30 segundos
    */

    setInterval(
        atualizarHeartbeat,
        30000
    );

}


/*
====================================================
 REALTIME
====================================================
*/

function ouvirEquipeTempoReal(){


    if(canalEquipe){

        banco.removeChannel(
            canalEquipe
        );

    }


    canalEquipe =

        banco

        .channel(
            "equipe-tempo-real"
        )


        .on(

            "postgres_changes",

            {

                event:"UPDATE",

                schema:"public",

                table:"usuarios"

            },

            payload => {

                console.log(
                    "Usuário atualizado:",
                    payload.new
                );


                /*
                Atualiza a equipe
                automaticamente.
                */

                carregarEquipe();

            }

        )


        .on(

            "postgres_changes",

            {

                event:"INSERT",

                schema:"public",

                table:"usuarios"

            },

            payload => {

                console.log(
                    "Novo usuário:",
                    payload.new
                );


                carregarEquipe();

            }

        )


        .on(

            "postgres_changes",

            {

                event:"DELETE",

                schema:"public",

                table:"usuarios"

            },

            payload => {

                console.log(
                    "Usuário removido:",
                    payload.old
                );


                carregarEquipe();

            }

        )


        .subscribe(

            status => {

                console.log(
                    "Realtime equipe:",
                    status
                );

            }

        );

}


/*
====================================================
 ATUALIZAR A TELA PERIODICAMENTE
====================================================
*/

function atualizarStatusVisual(){

    mostrarEquipe();

}


/*
====================================================
 INICIALIZAÇÃO
====================================================
*/

async function iniciarEquipe(){

    await descobrirEmpresa();

    await carregarEquipe();

    await iniciarPresenca();

    ouvirEquipeTempoReal();


    /*
    Atualiza a tela a cada 10 segundos
    para detectar quem ficou offline.
    */

    setInterval(
        atualizarStatusVisual,
        10000
    );

}


iniciarEquipe();

</script>


</body>

</html>
