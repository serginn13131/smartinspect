<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatórios - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="menu-container"></div>



<div class="content">


<h1>📄 Relatórios</h1>

<p>
Gerar e enviar relatórios técnicos de inspeção
</p>



<div class="card">


<label>
E-mail do destinatário
</label>


<input 
id="destinatario"
type="email"
placeholder="exemplo@email.com"
>


<br><br>


<p id="mensagemRelatorio"></p>



</div>




<div id="listaRelatorios">


Carregando inspeções...

</div>



</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>





<script>


verificarLogin();



let inspecoes=[];




const $ = id => document.getElementById(id);






async function carregarInspecoes(){



const {data,error}=await banco

.from("inspecoes")

.select(`

id,

tipo,

data_inspecao,

responsavel,

observacao,

status,

obra_id,

obras(

nome,

endereco

)

`)

.order("id",{ascending:false});





if(error){

console.log(error);

$("listaRelatorios").innerHTML=

'<div class="card">Erro ao carregar inspeções.</div>';

return;

}




inspecoes=data || [];





if(!inspecoes.length){


$("listaRelatorios").innerHTML=

'<div class="card">Nenhuma inspeção disponível.</div>';

return;

}






$("listaRelatorios").innerHTML =


inspecoes.map(inspecao=>`


<div class="card report-row">


<div>


<p>

INSPEÇÃO #${inspecao.id}

</p>



<h2>

${inspecao.tipo || "Inspeção"}

-

${inspecao.obras?.nome || "Sem obra"}

</h2>



<p>

${inspecao.data_inspecao || ""}

<br>

Responsável:
${inspecao.responsavel || ""}

<br>

Status:
${inspecao.status || ""}

</p>


</div>



<button onclick="gerarEEnviar(${inspecao.id})">

✉ Gerar e enviar PDF

</button>



</div>


`).join("");



}








function gerarPdf(inspecao){



const {jsPDF}=window.jspdf;


const pdf=new jsPDF();



const numero =

`SI-${new Date().getFullYear()}-${String(inspecao.id).padStart(5,"0")}`;





pdf.setFontSize(18);

pdf.text(
"SmartInspect AI",
20,
20
);



pdf.setFontSize(14);

pdf.text(
"RELATÓRIO TÉCNICO DE INSPEÇÃO",
20,
35
);




pdf.setFontSize(11);



pdf.text(

`Número: ${numero}`,

20,

50

);



pdf.text(

`Data: ${inspecao.data_inspecao || ""}`,

20,

60

);



pdf.text(

`Obra: ${inspecao.obras?.nome || "Não informada"}`,

20,

75

);



pdf.text(

`Endereço: ${inspecao.obras?.endereco || ""}`,

20,

85

);



pdf.text(

`Tipo: ${inspecao.tipo}`,

20,

100

);



pdf.text(

`Responsável: ${inspecao.responsavel}`,

20,

110

);



pdf.text(

`Status: ${inspecao.status}`,

20,

120

);



pdf.text(

"Observações:",

20,

140

);



pdf.text(

pdf.splitTextToSize(

inspecao.observacao || "Nenhuma observação",

170

),

20,

150

);




return {

pdf,

numero

};


}








async function gerarEEnviar(id){



const destinatario=$("destinatario").value.trim();




if(!destinatario){

$("mensagemRelatorio").innerHTML=

"Informe o e-mail do destinatário.";

return;

}




const inspecao=

inspecoes.find(i=>i.id===id);



if(!inspecao)return;




$("mensagemRelatorio").innerHTML=

"Gerando PDF e enviando...";





try{


const {pdf,numero}=gerarPdf(inspecao);



const base64=

pdf.output("datauristring")

.split(",")[1];





const nomeArquivo=

`${numero}.pdf`;





const registro=

await banco

.from("relatorios")

.insert([{

inspecao_id:id,

obra_id:inspecao.obra_id,

numero,

destinatario_email:destinatario,

status:"pendente"

}])

.select()

.single();







const {data,error}=await banco.functions.invoke(

"enviar-relatorio",

{

body:{

destinatario,

nomeArquivo,

pdfBase64:base64,

numeroRelatorio:numero,

assunto:

`Relatório ${numero}`

}

}

);







if(error || !data.ok){

throw new Error(

error?.message ||

data?.error

);

}







await banco

.from("relatorios")

.update({

status:"enviado",

enviado_em:new Date()

})

.eq(

"id",

registro.data.id

);







$("mensagemRelatorio").innerHTML=

`

✅ Relatório ${numero}

enviado com sucesso.

`;




}catch(e){



console.log(e);



$("mensagemRelatorio").innerHTML=

"❌ Erro ao enviar relatório. Confira a Edge Function.";

}




}






carregarInspecoes();



</script>



</body>

</html>
