<div class="content">


<h1>📋 Inspeções Realizadas</h1>

<p>Histórico das inspeções técnicas das obras</p>




<div id="listaInspecoes">

<p>Carregando inspeções...</p>

</div>




<br>


<button onclick="location.href='nova_inspecao.html'">

➕ Nova Inspeção

</button>



</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>







<script>





async function carregarInspecoes(){



if(typeof banco === "undefined"){


document.getElementById("listaInspecoes").innerHTML =
"❌ Banco não conectado";


return;


}






const {data,error}=await banco

.from("inspecoes")

.select(`

id,

tipo,

data_inspecao,

responsavel,

observacao,

status,

obras(nome)

`)

.order("id",{ascending:false});







let lista =
document.getElementById("listaInspecoes");






if(error){


console.log(error);


lista.innerHTML =
"❌ Erro ao carregar inspeções";


return;


}






if(!data || data.length === 0){


lista.innerHTML =
"Nenhuma inspeção cadastrada";


return;


}







lista.innerHTML="";







data.forEach(inspecao=>{





lista.innerHTML += `


<div class="card">


<h2>

📋 ${inspecao.tipo}

</h2>




<p>

🏢 Obra:

<strong>

${inspecao.obras?.nome || "Sem obra"}

</strong>

</p>




<p>

📅 Data:

${inspecao.data_inspecao}

</p>




<p>

👷 Responsável:

${inspecao.responsavel}

</p>




<p>

📌 Status:

${inspecao.status}

</p>




<p>

📝 Observação:

${inspecao.observacao || "Nenhuma"}

</p>





<br>



<button onclick="deletarInspecao(${inspecao.id})">

🗑 Excluir

</button>



</div>


`;





});





}









async function deletarInspecao(id){



let confirmar =
confirm(
"⚠️ Deseja excluir esta inspeção?"
);




if(!confirmar){

return;

}







const {error}=await banco

.from("inspecoes")

.delete()

.eq("id",id);







if(error){


console.log(error);


alert("❌ Erro ao excluir inspeção");


}

else{


alert("✅ Inspeção excluída");


carregarInspecoes();


}




}







carregarInspecoes();





</script>
