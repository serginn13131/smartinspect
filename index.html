<h2 id="obras">0</h2>

<div class="card">

<!-- Biblioteca Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- Conexão com banco -->

<script src="supabase.js"></script>


<!-- Funções do sistema -->

<script>


async function carregarDashboard(){


    // Obras
    let obras = await db
    .from("obras")
    .select("*");


    document.getElementById("obras").innerHTML =
    obras.data ? obras.data.length : 0;



    // Inspeções

    let inspecoes = await db
    .from("inspecoes")
    .select("*");


    document.getElementById("inspecoes").innerHTML =
    inspecoes.data ? inspecoes.data.length : 0;



    // Problemas encontrados

    let problemas = await db
    .from("nao_conformidades")
    .select("*");


    document.getElementById("problemas").innerHTML =
    problemas.data ? problemas.data.length : 0;



}


carregarDashboard();


</script>
