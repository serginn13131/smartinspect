<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/sidebar.js"></script>
  <script src="js/realtime.js"></script>






<script>



verificarLogin();







async function carregarDashboard(){





// OBRAS

const {data:obras}=await banco

.from("obras")

.select("*");



document.getElementById("totalObras").innerHTML =

obras ? obras.length : 0;







// INSPEÇÕES

const {data:inspecoes}=await banco

.from("inspecoes")

.select("*");



document.getElementById("totalInspecoes").innerHTML =

inspecoes ? inspecoes.length : 0;







// NÃO CONFORMIDADES

const {data:problemas}=await banco

.from("nao_conformidades")

.select("*");



document.getElementById("totalProblemas").innerHTML =

problemas ? problemas.length : 0;








// ESTOQUE

const {data:estoque}=await banco

.from("estoque")

.select("*");



document.getElementById("totalEstoque").innerHTML =

estoque ? estoque.length : 0;







// ONLINE

const {data:online}=await banco

.from("usuarios")

.select("nome")

.eq("online",true);




const lista=document.getElementById("usuariosOnline");



if(!online || online.length===0){


lista.innerHTML="Nenhum usuário online";


return;

}



lista.innerHTML="";



online.forEach(usuario=>{


lista.innerHTML += `

<p>
🟢 ${usuario.nome}
</p>

`;



});



}





carregarDashboard();





</script>



</body>
