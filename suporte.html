<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suporte - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

.conteudo-suporte {

padding: 30px;

max-width: 900px;

margin: auto;

}

.titulo-suporte {

margin-bottom: 25px;

}

.titulo-suporte h1 {

margin: 0;

font-size: 28px;

}

.titulo-suporte p {

margin-top: 8px;

color: #666;

}

.card-suporte {

background: white;

padding: 30px;

border-radius: 15px;

box-shadow: 0 4px 15px rgba(0,0,0,0.08);

}

.campo {

margin-bottom: 20px;

}

.campo label {

display: block;

font-weight: 600;

margin-bottom: 7px;

}

.campo input,
.campo select,
.campo textarea {

width: 100%;

box-sizing: border-box;

padding: 13px;

border: 1px solid #ddd;

border-radius: 8px;

font-size: 15px;

outline: none;

}

.campo input:focus,
.campo select:focus,
.campo textarea:focus {

border-color: #0066cc;

}

.campo textarea {

height: 150px;

resize: vertical;

}

.btn-suporte {

width: 100%;

padding: 14px;

border: none;

border-radius: 8px;

background: #0066cc;

color: white;

font-size: 16px;

font-weight: bold;

cursor: pointer;

}

.btn-suporte:hover {

background: #0055aa;

}

.mensagem {

display: none;

margin-top: 20px;

padding: 15px;

border-radius: 8px;

background: #e8f5e9;

color: #2e7d32;

text-align: center;

}

@media (max-width: 768px) {

.conteudo-suporte {

padding: 20px;

}

.card-suporte {

padding: 20px;

}

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo-area">

        <img src="imagens/logo.png" class="logo">

        <h2>SmartInspect AI</h2>

    </div>


    <nav>

        <a href="index.html">
            📊 Dashboard
        </a>

        <a href="imoveis.html">
            🏠 Imóveis
        </a>

        <a href="obras.html">
            🏢 Obras
        </a>

        <a href="inspecoes.html">
            📋 Inspeções
        </a>

        <a href="estoque.html">
            📦 Estoque
        </a>

        <a href="relatorios.html">
            📄 Relatórios
        </a>

        <a href="equipe.html">
            👥 Equipe
        </a>

        <a href="suporte.html" class="ativo">
            💬 Falar com suporte
        </a>

    </nav>

</div>


<!-- CONTEÚDO -->

<div class="main">

    <div class="conteudo-suporte">

        <div class="titulo-suporte">

            <h1>💬 Falar com suporte</h1>

            <p>
                Precisa de ajuda? Envie uma mensagem para nossa equipe de suporte.
            </p>

        </div>


        <div class="card-suporte">

            <form id="formSuporte">


                <div class="campo">

                    <label>Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Tipo de problema</label>

                    <select id="tipo" required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="Problema no sistema">
                            Problema no sistema
                        </option>

                        <option value="Problema no login">
                            Problema no login
                        </option>

                        <option value="Problema com inspeção">
                            Problema com inspeção
                        </option>

                        <option value="Problema com relatório">
                            Problema com relatório
                        </option>

                        <option value="Problema com fotos">
                            Problema com fotos
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Assunto</label>

                    <input
                        type="text"
                        id="assunto"
                        placeholder="Ex: Não consigo gerar relatório"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Mensagem</label>

                    <textarea
                        id="mensagem"
                        placeholder="Descreva o problema ou dúvida..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn-suporte"
                >

                    📨 Enviar mensagem

                </button>


                <div
                    id="mensagemSucesso"
                    class="mensagem"
                >

                    ✅ Mensagem enviada com sucesso!

                </div>


            </form>

        </div>

    </div>

</div>


<script>

document
.getElementById("formSuporte")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const nome =
        document.getElementById("nome").value;

    const email =
        document.getElementById("email").value;

    const tipo =
        document.getElementById("tipo").value;

    const assunto =
        document.getElementById("assunto").value;

    const mensagem =
        document.getElementById("mensagem").value;


    console.log({

        nome,
        email,
        tipo,
        assunto,
        mensagem

    });


    document
    .getElementById("mensagemSucesso")
    .style.display = "block";


    document
    .getElementById("formSuporte")
    .reset();

});

</script>


</body>

</html>
