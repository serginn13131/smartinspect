<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Suporte - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

.conteudo-suporte {
    padding: 30px;
    max-width: 900px;
    margin: auto;
}

.titulo-suporte {
    margin-bottom: 25px;
}

.titulo-suporte h1 {
    margin: 0;
    font-size: 28px;
}

.titulo-suporte p {
    margin-top: 8px;
    color: #666;
}

.card-suporte {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.campo {
    margin-bottom: 20px;
}

.campo label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

.campo input,
.campo select,
.campo textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus {
    border-color: #0066cc;
}

.campo textarea {
    height: 150px;
    resize: vertical;
}

.btn-suporte {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #0066cc;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-suporte:hover {
    background: #0055aa;
}

.btn-suporte:disabled {
    background: #999;
    cursor: not-allowed;
}

.mensagem {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
}

.sucesso {
    background: #e8f5e9;
    color: #2e7d32;
}

.erro {
    background: #ffebee;
    color: #c62828;
}

@media (max-width: 768px) {

    .conteudo-suporte {
        padding: 20px;
    }

    .card-suporte {
        padding: 20px;
    }

}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo-area">

        <img src="imagens/logo.png" class="logo">

        <h2>SmartInspect AI</h2>

    </div>


    <nav>

        <a href="index.html">
            📊 Dashboard
        </a>

        <a href="imoveis.html">
            🏠 Imóveis
        </a>

        <a href="obras.html">
            🏢 Obras
        </a>

        <a href="inspecoes.html">
            📋 Inspeções
        </a>

        <a href="estoque.html">
            📦 Estoque
        </a>

        <a href="relatorios.html">
            📄 Relatórios
        </a>

        <a href="equipe.html">
            👥 Equipe
        </a>

        <a href="suporte.html" class="ativo">
            💬 Falar com suporte
        </a>

    </nav>

</div>


<!-- CONTEÚDO -->

<div class="main">

    <div class="conteudo-suporte">

        <div class="titulo-suporte">

            <h1>💬 Falar com suporte</h1>

            <p>
                Precisa de ajuda? Envie uma mensagem para nossa equipe de suporte.
            </p>

        </div>


        <div class="card-suporte">

            <form id="formSuporte">


                <div class="campo">

                    <label>Nome</label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label>E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Tipo de problema</label>

                    <select id="tipo" required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="Problema no sistema">
                            Problema no sistema
                        </option>

                        <option value="Problema no login">
                            Problema no login
                        </option>

                        <option value="Problema com inspeção">
                            Problema com inspeção
                        </option>

                        <option value="Problema com relatório">
                            Problema com relatório
                        </option>

                        <option value="Problema com fotos">
                            Problema com fotos
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>Assunto</label>

                    <input
                        type="text"
                        id="assunto"
                        placeholder="Ex: Não consigo gerar relatório"
                        required
                    >

                </div>


                <div class="campo">

                    <label>Mensagem</label>

                    <textarea
                        id="mensagem"
                        placeholder="Descreva o problema ou dúvida..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn-suporte"
                    id="btnEnviar"
                >

                    📨 Enviar mensagem

                </button>


                <div
                    id="mensagemSucesso"
                    class="mensagem sucesso"
                >
                    ✅ Mensagem enviada com sucesso!
                </div>


                <div
                    id="mensagemErro"
                    class="mensagem erro"
                >
                    ❌ Não foi possível enviar a mensagem.
                </div>


            </form>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://iibdvkxztgrlrwzqbfrg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qMjvqXKJW_5onSUZjymiSw_0KfZi44D";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function carregarUsuario() {

    const {
        data: {
            user
        },
        error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

        alert("Sua sessão expirou. Faça login novamente.");

        window.location.href = "login.html";

        return;

    }


    document.getElementById("email").value =
        user.email || "";


    const {
        data: perfil,
        error: erroPerfil
    } = await supabaseClient
        .from("usuarios")
        .select("nome")
        .eq("auth_id", user.id)
        .maybeSingle();


    if (!erroPerfil && perfil) {

        document.getElementById("nome").value =
            perfil.nome || "";

    }

}


carregarUsuario();


document
.getElementById("formSuporte")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const btn =
        document.getElementById("btnEnviar");

    const mensagemSucesso =
        document.getElementById("mensagemSucesso");

    const mensagemErro =
        document.getElementById("mensagemErro");


    mensagemSucesso.style.display = "none";
    mensagemErro.style.display = "none";


    btn.disabled = true;

    btn.innerText = "Enviando...";


    try {


        const {
            data: {
                user
            },
            error: erroUsuario
        } = await supabaseClient.auth.getUser();


        if (erroUsuario || !user) {

            throw new Error(
                "Usuário não está logado."
            );

        }


        const nome =
            document.getElementById("nome").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const tipo =
            document.getElementById("tipo").value;

        const assunto =
            document.getElementById("assunto").value.trim();

        const mensagem =
            document.getElementById("mensagem").value.trim();


        const {
            error
        } = await supabaseClient
            .from("chamados_suporte")
            .insert([{

                usuario_id: user.id,

                nome: nome,

                email: email,

                tipo: tipo,

                assunto: assunto,

                mensagem: mensagem,

                status: "aberto"

            }]);


        if (error) {

            console.error(
                "Erro Supabase:",
                error
            );

            throw error;

        }


        mensagemSucesso.style.display =
            "block";


        document
            .getElementById("formSuporte")
            .reset();


        document.getElementById("email").value =
            user.email || "";


        btn.innerText =
            "✅ Mensagem enviada";


        setTimeout(function() {

            btn.disabled = false;

            btn.innerText =
                "📨 Enviar mensagem";

        }, 3000);


    } catch (erro) {


        console.error(
            "Erro ao enviar suporte:",
            erro
        );


        mensagemErro.style.display =
            "block";


        btn.disabled = false;

        btn.innerText =
            "📨 Enviar mensagem";

    }

});

</script>


</body>

</html>
