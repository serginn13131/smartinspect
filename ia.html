<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IA - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>


.chat-container{

max-width:900px;

}



.chat-box{

height:420px;

overflow-y:auto;

background:#f5f7fb;

padding:20px;

border-radius:15px;

}



.mensagem{

padding:12px 16px;

margin:12px 0;

max-width:75%;

border-radius:15px;

line-height:1.5;

}



.mensagem.ia{

background:white;

box-shadow:0 2px 8px #0002;

margin-right:auto;

}



.mensagem.usuario{

background:#0066cc;

color:white;

margin-left:auto;

}



.chat-input{

display:flex;

gap:10px;

margin-top:15px;

}



.chat-input textarea{

flex:1;

padding:12px;

border-radius:12px;

resize:none;

}



.chat-input button{

width:60px;

border:none;

border-radius:50%;

background:#0066cc;

color:white;

font-size:22px;

}



.resultado-ia{

background:#f5f5f5;

padding:20px;

border-radius:15px;

margin-top:20px;

}



</style>


</head>



<body>


<div class="menu-container"></div>



<div class="content">


<h1>🤖 SmartInspect AI</h1>

<p>
Assistente inteligente para inspeções e construção civil
</p>




<!-- CHAT IA -->

<div class="card chat-container">


<h2>
💬 Conversar com IA
</h2>


<div id="chatBox" class="chat-box">


<div class="mensagem ia">

🤖 Olá! Sou o SmartInspect AI.

Posso ajudar com:

<br>
✔ Inspeções
<br>
✔ Patologias da construção
<br>
✔ Materiais
<br>
✔ Normas técnicas
<br>
✔ Correções

</div>


</div>




<div class="chat-input">


<textarea

id="perguntaIA"

rows="2"

placeholder="Digite sua pergunta..."

onkeydown="enviarEnter(event)"

></textarea>



<button onclick="conversarIA()">

➤

</button>



</div>


</div>







<!-- ANALISE DE IMAGEM -->


<div class="card">


<h2>
📷 Analisar imagem da obra
</h2>


<input 

type="file"

id="imagem"

accept="image/*">



<br><br>



<button onclick="analisarImagem()">

🔍 Analisar com IA

</button>




<div id="resultadoImagem"

class="resultado-ia">

Aguardando imagem...

</div>



</div>




</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/configuracoes.js"></script>
<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>





<script>


verificarLogin();




// ========================
// CHAT IA
// ========================



function enviarEnter(event){


if(event.key==="Enter" && !event.shiftKey){


event.preventDefault();


conversarIA();


}


}







async function conversarIA(){



const campo =
document.getElementById("perguntaIA");



const pergunta =
campo.value.trim();



if(!pergunta)return;



adicionarMensagem(
pergunta,
"usuario"
);



campo.value="";



const chat =
document.getElementById("chatBox");



const carregando =
document.createElement("div");


carregando.className="mensagem ia";

carregando.innerHTML=
"🤖 Pensando...";


chat.appendChild(carregando);



chat.scrollTop =
chat.scrollHeight;





try{


const resposta =
await fetch(

"/api/chat-ia",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

mensagem:pergunta

})


}

);




const dados =
await resposta.json();



carregando.remove();




adicionarMensagem(

dados.resposta,

"ia"

);



}

catch(error){



carregando.remove();



adicionarMensagem(

"❌ Erro ao conectar com a IA",

"ia"

);


}



}





function adicionarMensagem(texto,tipo){



const chat =
document.getElementById("chatBox");



chat.innerHTML += `


<div class="mensagem ${tipo}">

${tipo==="ia"?"🤖":"👤"}

${texto}

</div>


`;



chat.scrollTop =
chat.scrollHeight;



}








// ========================
// ANALISE DE IMAGEM
// ========================



async function analisarImagem(){



const arquivo =

document.getElementById("imagem").files[0];



if(!arquivo){

alert("Selecione uma imagem");

return;

}




const resultado =

document.getElementById("resultadoImagem");



resultado.innerHTML =
"🤖 Analisando imagem...";





const formData =
new FormData();



formData.append(

"imagem",

arquivo

);





try{


const resposta =

await fetch(

"/api/analisar-imagem",

{

method:"POST",

body:formData

}

);





const dados =

await resposta.json();





resultado.innerHTML = `


<h3>

🤖 Resultado da análise

</h3>


<p>

${dados.analise || dados.resposta}

</p>


`;




}

catch(error){



resultado.innerHTML=

"❌ Erro ao analisar imagem";


}



}



</script>



</body>

</html>
