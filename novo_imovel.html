<div class="content">


<h1>🏠 Novo Imóvel</h1>

<p>
Cadastro de imóvel vinculado à obra
</p>






<div class="card">



<label>
🏢 Obra
</label>


<select id="obra">

<option>
Carregando obras...
</option>

</select>






<label>
🏠 Nome do imóvel
</label>


<input 
id="nome"
type="text"
placeholder="Ex: Apartamento 101">






<label>
🏷 Tipo
</label>


<select id="tipo">


<option>
Apartamento
</option>


<option>
Casa
</option>


<option>
Comercial
</option>


<option>
Galpão
</option>


</select>







<label>
📍 Endereço
</label>


<input 
id="endereco"
placeholder="Endereço do imóvel">






<label>
👤 Cliente
</label>


<input 
id="cliente"
placeholder="Nome do cliente">






<label>
📷 Foto do imóvel
</label>


<input 
id="foto"
type="file"
accept="image/*">






<label>
📌 Status
</label>


<select id="status">


<option>
Em construção
</option>


<option>
Pronto
</option>


<option>
Entregue
</option>


</select>







<label>
📝 Observação
</label>


<textarea 
id="observacao"
rows="5"></textarea>






<br>


<button onclick="salvarImovel()">

💾 Salvar Imóvel

</button>



<p id="mensagem"></p>



</div>




</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>







<script>


verificarLogin();







async function carregarObras(){



const {data,error}=await banco

.from("obras")

.select("*")

.order("id",{ascending:false});





const select=document.getElementById("obra");



select.innerHTML="";





if(error){

console.log(error);

return;

}





data.forEach(obra=>{


select.innerHTML += `

<option value="${obra.id}">

${obra.nome}

</option>

`;


});



}









async function salvarImovel(){



const arquivo =

document.getElementById("foto").files[0];



let fotoUrl = null;







if(arquivo){



const nomeArquivo =

Date.now()+"_"+arquivo.name;





const {error:erroUpload}=await banco.storage

.from("imoveis")

.upload(nomeArquivo,arquivo);





if(erroUpload){


console.log(erroUpload);


alert("Erro ao enviar foto");


return;


}






const url=banco.storage

.from("imoveis")

.getPublicUrl(nomeArquivo);



fotoUrl=url.data.publicUrl;



}







const {error}=await banco

.from("imoveis")

.insert([{


obra_id:

document.getElementById("obra").value,


nome:

document.getElementById("nome").value,


tipo:

document.getElementById("tipo").value,


endereco:

document.getElementById("endereco").value,


cliente:

document.getElementById("cliente").value,


foto:

fotoUrl,


status:

document.getElementById("status").value,


observacao:

document.getElementById("observacao").value



}]);








if(error){


console.log(error);


document.getElementById("mensagem").innerHTML=

"❌ Erro ao salvar imóvel";


return;


}





document.getElementById("mensagem").innerHTML=

"✅ Imóvel cadastrado com sucesso!";




}





carregarObras();



</script>
