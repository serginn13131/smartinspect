<h1>📦 Novo Estoque</h1>

<p>
Cadastro de material da obra
</p>




<div class="card">



<label>
🏢 Obra
</label>


<select id="obra">

<option>
Carregando obras...
</option>

</select>







<label>
📦 Material
</label>


<input 
id="material"
type="text"
placeholder="Ex: Cimento CP II">







<label>
📷 Foto do material
</label>


<input 
id="foto"
type="file"
accept="image/*">







<label>
🔢 Quantidade
</label>


<input 
id="quantidade"
type="number"
placeholder="Quantidade">







<label>
📏 Unidade
</label>


<input 
id="unidade"
type="text"
placeholder="Ex: saco, kg, m³">







<label>
⚠️ Estoque mínimo
</label>


<input 
id="minimo"
type="number"
placeholder="Quantidade mínima">







<label>
📅 Data de entrada
</label>


<input 
id="data"
type="date">







<br>


<button onclick="salvarEstoque()">

💾 Salvar Estoque

</button>



<p id="mensagem"></p>



</div>







</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>






<script>


verificarLogin();





async function carregarObras(){


const {data,error}=await banco

.from("obras")

.select("*");



const select=document.getElementById("obra");



select.innerHTML="";



data.forEach(obra=>{


select.innerHTML += `

<option value="${obra.id}">

${obra.nome}

</option>

`;


});


}




async function salvarEstoque(){



const arquivo =
document.getElementById("foto").files[0];



let caminhoFoto = null;





if(arquivo){


const nomeArquivo =
Date.now()+"_"+arquivo.name;



const {error:erroUpload}=await banco.storage

.from("estoque")

.upload(nomeArquivo,arquivo);




if(erroUpload){

console.log(erroUpload);

alert("Erro ao enviar foto");

return;

}



const url = banco.storage

.from("estoque")

.getPublicUrl(nomeArquivo);



caminhoFoto =
url.data.publicUrl;



}







const usuario =
JSON.parse(localStorage.getItem("usuario"));







const {error}=await banco

.from("estoque")

.insert([{


obra_id:
document.getElementById("obra").value,


material:
document.getElementById("material").value,


foto:
caminhoFoto,


quantidade:
document.getElementById("quantidade").value,


unidade:
document.getElementById("unidade").value,


estoque_minimo:
document.getElementById("minimo").value,


data_entrada:
document.getElementById("data").value,


responsavel:
usuario.nome,


status:
"Disponível"



}]);







if(error){


console.log(error);


document.getElementById("mensagem").innerHTML=

"❌ Erro ao salvar estoque";


return;


}





document.getElementById("mensagem").innerHTML=

"✅ Estoque cadastrado com sucesso!";





}







carregarObras();




</script>
